<style>
/* Sticky footer */
html {
  height: 100%;
}

body {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

main, #wb-cont {
  flex: 1 0 auto;
}

#wb-info {
  flex-shrink: 0;
  margin-top: auto;
}

/* Modal styling */
.modal.show {
  display: block !important;
  opacity: 1 !important;
}

.modal-dialog {
  position: relative;
  z-index: 1060 !important;
}

.modal-content {
  min-height: 200px;
  max-height: calc(100vh - 100px);
  display: flex;
  flex-direction: column;
}

.modal-header {
  background-color: #2b4380;
  color: white !important;
  flex-shrink: 0;
  border-bottom: none;
  padding: 15px 20px;
  border-radius: 8px 8px 0 0;
  position: relative;
  padding-right: 50px !important;
}

.modal-header .btn-close,
.modal-header .close {
  background: transparent !important;
  border: none !important;
  color: white !important;
  opacity: 1 !important;
  font-size: 28px !important;
  font-weight: 300 !important;
  padding: 8px !important;
  width: 30px !important;
  height: 30px !important;
  position: absolute !important;
  right: 15px !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
}

.modal-header .close:hover {
  background-color: rgba(255, 255, 255, 0.15) !important;
  border-radius: 4px;
}

.modal-body {
  flex: 1 1 auto;
  max-height: calc(100vh - 200px) !important;
  overflow-y: auto !important;
  padding: 20px;
}

.modal-footer {
  flex-shrink: 0;
  padding: 15px 20px;
  border-top: 1px solid #dee2e6;
}

.modal-dialog {
  max-width: 900px !important;
  min-width: 900px !important;
  margin: auto !important;
}

@media (max-width: 992px) {
  .modal-dialog {
    max-width: 95% !important;
    min-width: 0 !important;
  }
}
</style>

<footer id="wb-info" style="background: #26374A; padding: 20px 0;">
  <div class="container">
    <div class="row">
      <div class="col-sm-8"></div>
      <div class="col-sm-4 text-right">
        <img src="https://www.canada.ca/etc/designs/canada/wet-boew/assets/wmms-blk.svg" alt="Symbol of the Government of Canada" style="height: 24px; filter: brightness(0) invert(1);">
      </div>
    </div>
  </div>
</footer>

<script>
// Smart modal blocker - only prevents auto-opening on page load, allows user-initiated modals
(function() {
  console.log('🟢 Smart modal blocker initialized');
  
  // Track user interactions
  window.USER_INITIATED_ACTION = false;
  
  // Prevent ONLY auto-opening modals in first 3 seconds after page load
  let pageLoadTime = Date.now();
  let blockingActive = true;
  
  // Disable blocking after 3 seconds
  setTimeout(function() {
    blockingActive = false;
    console.log('✅ Auto-modal blocking disabled - user interactions now allowed');
  }, 3000);
  
  // Track ALL user clicks that might open modals
  document.addEventListener('click', function(e) {
    const modalTrigger = e.target.closest(
      '.launchentitylookup, ' +      // Lookup buttons
      '.create-action, ' +             // Create buttons
      '.edit-action, ' +               // Edit buttons
      '.delete-action, ' +             // Delete buttons
      '[data-toggle="modal"], ' +      // Bootstrap 4 triggers
      '[data-bs-toggle="modal"], ' +   // Bootstrap 5 triggers
      'a[href*="modal"], ' +           // Links to modals
      'button[onclick*="modal"]'       // Buttons with modal onclick
    );
    
    if (modalTrigger) {
      console.log('✅ User clicked modal trigger:', modalTrigger.className);
      window.USER_INITIATED_ACTION = true;
      
      // Keep flag active for 5 seconds
      setTimeout(function() {
        window.USER_INITIATED_ACTION = false;
      }, 5000);
    }
  }, true);
  
  // Only block auto-opening modals during initial page load
  const preventAutoModals = function() {
    if (!blockingActive || window.USER_INITIATED_ACTION) {
      return; // Don't block after 3 seconds or if user clicked
    }
    
    const modals = document.querySelectorAll('.modal');
    
    modals.forEach(function(modal) {
      // Only hide modals that are showing WITHOUT user action
      if ((modal.classList.contains('show') || modal.style.display === 'flex' || modal.style.display === 'block') && 
          !window.USER_INITIATED_ACTION) {
        
        console.log('🚫 Blocked auto-opening modal:', modal.className);
        
        modal.classList.remove('show');
        modal.style.display = 'none';
        modal.style.opacity = '0';
        modal.style.visibility = 'hidden';
        modal.setAttribute('aria-hidden', 'true');
      }
    });
    
    // Remove any orphaned backdrops
    if (!window.USER_INITIATED_ACTION) {
      document.querySelectorAll('.modal-backdrop').forEach(function(bd) {
        bd.remove();
      });
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }
  };
  
  // Only run during first 3 seconds
  const intervals = [100, 300, 500, 1000, 2000];
  intervals.forEach(function(delay) {
    setTimeout(function() {
      if (blockingActive) {
        preventAutoModals();
      }
    }, delay);
  });
  
  console.log('🟢 Auto-modal blocking active for 3 seconds');
})();

// Lookup modal selection handler
(function() {
  console.log('🟢 Lookup selection handler initialized');
  
  // Handle Select button clicks in lookup modal
  document.addEventListener('click', function(e) {
    const selectButton = e.target.closest('.modal-lookup .btn.primary, .modal-lookup .btn-primary');
    
    if (selectButton && selectButton.textContent.trim() === 'Select') {
      console.log('✅ Select button clicked');
      
      const lookupModal = selectButton.closest('.modal-lookup');
      const checkedCheckbox = lookupModal.querySelector('.view-grid tbody .fa[aria-checked="true"]');
      
      if (!checkedCheckbox) {
        console.log('⚠️ No record selected');
        return;
      }
      
      const row = checkedCheckbox.closest('tr');
      const recordId = row.getAttribute('data-id');
      
      // Get name from table cell
      const nameCell = row.querySelector('td[data-attribute="fullname"]');
      let recordName = nameCell ? nameCell.textContent.trim() : '';
      
      // Fallback to email if no name
      if (!recordName) {
        const emailCell = row.querySelector('td[data-attribute="emailaddress1"]');
        recordName = emailCell ? emailCell.textContent.trim() : 'Selected Record';
      }
      
      console.log('📝 Selected:', recordName, recordId);
      
      // Get field name
      const lookupModalContainer = lookupModal.closest('.lookup-modal');
      const entityLookup = lookupModalContainer ? lookupModalContainer.querySelector('.entity-lookup') : null;
      const fieldName = entityLookup ? entityLookup.getAttribute('data-lookup-datafieldname') : '';
      
      if (!fieldName) {
        console.error('❌ Could not find field name');
        return;
      }
      
      // Find input fields
      const lookupInput = document.querySelector(`input#${fieldName}_name`);
      const lookupHiddenInput = document.querySelector(`input#${fieldName}`);
      
      if (lookupInput && recordName) {
        // Populate visible input
        lookupInput.value = recordName;
        console.log('✅ Populated visible field');
        
        // Populate hidden ID input
        if (lookupHiddenInput && recordId) {
          lookupHiddenInput.value = recordId;
          lookupHiddenInput.classList.add('dirty');
          console.log('✅ Populated hidden ID');
        }
        
        // Trigger change events
        lookupInput.dispatchEvent(new Event('change', { bubbles: true }));
        if (lookupHiddenInput) {
          lookupHiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
        }
        
        // Close modal
        const closeButton = lookupModal.querySelector('[data-bs-dismiss="modal"], .close, .form-close');
        if (closeButton) {
          closeButton.click();
          console.log('✅ Modal closed');
        }
      } else {
        console.error('❌ Could not populate fields');
      }
    }
  });
  
  // Handle checkbox selection
  document.addEventListener('click', function(e) {
    const checkbox = e.target.closest('.modal-lookup .view-grid tbody .fa');
    
    if (checkbox) {
      console.log('✅ Checkbox clicked');
      
      const lookupModal = checkbox.closest('.modal-lookup');
      
      // Uncheck all others
      lookupModal.querySelectorAll('.view-grid tbody .fa').forEach(cb => {
        cb.setAttribute('aria-checked', 'false');
        cb.classList.remove('fa-check-square');
        cb.classList.add('fa-square-o');
      });
      
      // Check this one
      checkbox.setAttribute('aria-checked', 'true');
      checkbox.classList.remove('fa-square-o');
      checkbox.classList.add('fa-check-square');
      
      // Enable Select button
      const selectButton = lookupModal.querySelector('.btn.primary, .btn-primary');
      if (selectButton) {
        selectButton.removeAttribute('disabled');
      }
    }
  });
})();

// Remove fade class from lookup modals when opened
(function() {
  document.addEventListener('click', function(e) {
    if (e.target.closest('.launchentitylookup')) {
      console.log('🔍 Lookup button clicked - preparing modal');
      
      // Mark as user-initiated
      window.USER_INITIATED_ACTION = true;
      
      setTimeout(function() {
        const lookupModal = document.querySelector('section.modal.modal-lookup');
        
        if (lookupModal) {
          // Remove fade class for instant display
          lookupModal.classList.remove('fade');
          console.log('✅ Lookup modal ready');
        }
      }, 100);
    }
  }, true);
})();

console.log('🎯 All modal handlers loaded successfully');

// Clean up lookup modal text
(function() {
  console.log('🧹 Lookup modal text cleaner initialized');
  
  // Function to clean up modal text
  const cleanupLookupModal = function() {
    const lookupModal = document.querySelector('.modal-lookup');
    if (!lookupModal) return;
    
    // Clean up column headers - remove sort text
    const headers = lookupModal.querySelectorAll('.view-grid table thead th a');
    headers.forEach(function(header) {
      const text = header.textContent;
      
      // Extract just the column name (before the sort indicator)
      let cleanText = text.split('.')[0].trim(); // Remove ". sort ascending"
      cleanText = cleanText.replace(/↑|↓/g, '').trim(); // Remove arrows
      cleanText = cleanText.replace(/\s+sort\s+(ascending|descending)/gi, '').trim(); // Remove "sort ascending/descending"
      
      // Update header text
      if (cleanText && cleanText !== text) {
        header.textContent = cleanText;
        console.log('✅ Cleaned header:', text, '→', cleanText);
      }
    });
    
    // Clean up close button - ensure only × shows
    const closeButtons = lookupModal.querySelectorAll('.modal-header .close, .modal-header .form-close');
    closeButtons.forEach(function(btn) {
      // If button contains text other than ×
      const text = btn.textContent.trim();
      if (text && text !== '×' && text.length > 1) {
        btn.textContent = '×';
        console.log('✅ Cleaned close button');
      }
    });
  };
  
  // Run cleanup when lookup button is clicked
  document.addEventListener('click', function(e) {
    if (e.target.closest('.launchentitylookup')) {
      setTimeout(cleanupLookupModal, 200);
      setTimeout(cleanupLookupModal, 500);
      setTimeout(cleanupLookupModal, 1000);
    }
  }, true);
  
  // Also run on any modal shown
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
        const target = mutation.target;
        if (target.classList && target.classList.contains('modal-lookup') && target.classList.contains('show')) {
          setTimeout(cleanupLookupModal, 100);
        }
      }
    });
  });
  
  observer.observe(document.body, {
    attributes: true,
    attributeFilter: ['class'],
    subtree: true
  });
  
  console.log('🧹 Text cleaner ready');
})();

// Fix close button text for ALL modals
(function() {
  console.log('🧹 Universal close button fixer initialized');
  
  const fixCloseButton = function() {
    const closeButtons = document.querySelectorAll('.modal-header .close, .modal-header .form-close, .modal-header .btn-close, .modal-header button[data-bs-dismiss]');
    
    closeButtons.forEach(function(btn) {
      // Check if button has text other than ×
      const text = btn.textContent.trim();
      if (text && text.length > 1) {
        // Replace with just ×
        btn.textContent = '×';
        console.log('✅ Fixed close button text');
      }
    });
  };
  
  // Watch for any modal appearing
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
        const target = mutation.target;
        if (target.classList && target.classList.contains('modal') && target.classList.contains('show')) {
          setTimeout(fixCloseButton, 100);
        }
      }
    });
  });
  
  observer.observe(document.body, {
    attributes: true,
    attributeFilter: ['class'],
    subtree: true
  });
  
  // Also fix on any button click
  document.addEventListener('click', function(e) {
    if (e.target.closest('.create-action, .edit-action, .delete-action, .launchentitylookup')) {
      setTimeout(fixCloseButton, 200);
      setTimeout(fixCloseButton, 500);
    }
  }, true);
  
  console.log('🧹 Close button fixer ready');
})();


</script>
