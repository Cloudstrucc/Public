<script>
console.log('🔥 PEPP-Scripts-Base LOADED - Version 1.0');

/* ========================================
   PEPP Scripts Library v1.0
   ======================================== */

// Modal blocker DISABLED - all modals allowed
(function() {
  console.log('⚠️ Modal blocker DISABLED - all modals allowed');
  
  window.USER_INITIATED_ACTION = true;
  
  document.addEventListener('click', function(e) {
    window.USER_INITIATED_ACTION = true;
  }, true);
})();

// SMART: Force modals visible when user clicks action buttons
(function() {
  console.log('🚀 Smart modal display initializer started');
  
  let lastClickTime = 0;
  let modalAlreadyShown = false;
  
  // Track when user clicks modal trigger buttons
  document.addEventListener('click', function(e) {
    const isLookupButton = e.target.closest('.launchentitylookup');
    const isModalTrigger = e.target.closest(
      '.create-action, ' +
      '.edit-action, ' +
      '.delete-action, ' +
      '.dropdown-item, ' +
      '.launchentitylookup, ' +
      'a[role="button"], ' +
      '[data-toggle="modal"], ' +
      '[data-bs-toggle="modal"]'
    );
    
    if (isModalTrigger) {
      console.log('🎯 User clicked modal trigger button');
      lastClickTime = Date.now();
      
      // IMPORTANT: For lookup buttons, allow opening even if another modal is shown
      if (isLookupButton) {
        console.log('🔍 Lookup button - allowing nested modal');
        modalAlreadyShown = false; // Always reset for lookup buttons
      } else {
        modalAlreadyShown = false; // Reset for other buttons
      }
      
      // Check for modals immediately and repeatedly
      checkForModals();
      setTimeout(checkForModals, 100);
      setTimeout(checkForModals, 300);
      setTimeout(checkForModals, 500);
      setTimeout(checkForModals, 1000);
    }
  }, true);
  
  const forceModalVisible = function(modal) {
    if (!modal) return;
    
    console.log('💪 FORCING modal visible:', modal.className);
    
    // Remove Bootstrap fade
    modal.classList.remove('fade');
    
    // Force display on the modal wrapper
    modal.style.setProperty('display', 'flex', 'important');
    modal.style.setProperty('opacity', '1', 'important');
    modal.style.setProperty('visibility', 'visible', 'important');
    modal.style.setProperty('z-index', '10050', 'important');
    modal.style.setProperty('align-items', 'center', 'important');
    modal.style.setProperty('justify-content', 'center', 'important');
    
    // Add show class
    modal.classList.add('show');
    modal.removeAttribute('aria-hidden');
    modal.setAttribute('aria-modal', 'true');
    
    // CRITICAL: Force modal-dialog width and styling
    const modalDialog = modal.querySelector('.modal-dialog');
    if (modalDialog) {
      const screenWidth = window.innerWidth;
      console.log('📐 Screen width:', screenWidth);
      
      // Determine width based on modal type and screen size
      const isLookupModal = modal.classList.contains('modal-lookup');
      
      if (screenWidth >= 1400) {
        // Large desktop - full widths
        const width = isLookupModal ? '1400px' : '900px';
        console.log('🖥️ Large desktop - setting width:', width);
        
        // Set width properties
        modalDialog.style.setProperty('max-width', width, 'important');
        modalDialog.style.setProperty('min-width', width, 'important');
        modalDialog.style.setProperty('width', width, 'important');
        
        // Also remove any flex properties that might interfere
        modalDialog.style.setProperty('flex', 'none', 'important');
        modalDialog.style.setProperty('flex-basis', 'auto', 'important');
        modalDialog.style.setProperty('flex-grow', '0', 'important');
        modalDialog.style.setProperty('flex-shrink', '0', 'important');
        
      } else if (screenWidth >= 992) {
        // Desktop - slightly smaller
        const width = isLookupModal ? '95%' : '900px';
        console.log('💻 Desktop - setting width:', width);
        
        modalDialog.style.setProperty('max-width', width, 'important');
        modalDialog.style.setProperty('min-width', '0', 'important');
        modalDialog.style.setProperty('width', width, 'important');
        modalDialog.style.setProperty('flex', 'none', 'important');
        
      } else if (screenWidth >= 768) {
        // Tablet
        console.log('📱 Tablet - setting width: 95%');
        modalDialog.style.setProperty('max-width', '95%', 'important');
        modalDialog.style.setProperty('min-width', '0', 'important');
        modalDialog.style.setProperty('width', '95%', 'important');
        modalDialog.style.setProperty('flex', 'none', 'important');
        
      } else {
        // Mobile
        console.log('📱 Mobile - setting width: 100%');
        modalDialog.style.setProperty('max-width', '100%', 'important');
        modalDialog.style.setProperty('min-width', '0', 'important');
        modalDialog.style.setProperty('width', '100%', 'important');
        modalDialog.style.setProperty('flex', 'none', 'important');
      }
      
      // Center the dialog
      modalDialog.style.setProperty('margin', '1.75rem auto', 'important');
      
      // Ensure modal-content also doesn't constrain width
      const modalContent = modalDialog.querySelector('.modal-content');
      if (modalContent) {
        modalContent.style.setProperty('width', '100%', 'important');
        modalContent.style.setProperty('min-height', '400px', 'important');
        modalContent.style.setProperty('max-height', 'calc(100vh - 3.5rem)', 'important');
      }
      
      // NUCLEAR: Keep re-applying width for 2 seconds to fight any CSS
      let applyCount = 0;
      const widthValue = isLookupModal ? (screenWidth >= 1400 ? '1400px' : '95%') : '900px';
      const keepApplying = setInterval(function() {
        modalDialog.style.setProperty('width', widthValue, 'important');
        modalDialog.style.setProperty('max-width', widthValue, 'important');
        modalDialog.style.setProperty('min-width', widthValue, 'important');
        applyCount++;
        if (applyCount > 10) {
          clearInterval(keepApplying);
          console.log('🔒 Width locked at:', widthValue);
        }
      }, 200);
    }
    
    // Ensure backdrop
    if (!document.querySelector('.modal-backdrop.show')) {
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop fade show';
      backdrop.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 10040;';
      document.body.appendChild(backdrop);
      console.log('✅ Created modal backdrop');
    }
    
    // Lock body
    if (!document.body.classList.contains('modal-open')) {
      document.body.classList.add('modal-open');
      document.body.style.overflow = 'hidden';
    }
    
    console.log('✅ Modal forced visible with proper dimensions');
  };
  
  const isFormModal = function(modal) {
    return modal.classList.contains('modal-form') ||
           modal.classList.contains('modal-lookup');
  };
  
  const checkForModals = function() {
    const timeSinceClick = Date.now() - lastClickTime;
    
    // Only check if clicked recently
    if (timeSinceClick > 3000) return;
    
    // Allow checking even if modalAlreadyShown is true (for nested lookup modals)
    // We'll check if there's a NEW modal to show
    
    console.log('🔍 Checking for modals...');
    
    // Find all modals
    const modals = document.querySelectorAll('.modal');
    console.log('Found', modals.length, 'total modals in DOM');
    
    // Find the FIRST modal Power Pages wants to show (not the last!)
    // PRIORITY: Lookup modals > Form modals (for nested scenarios)
    let targetModal = null;
    
    // First, check for lookup modals (they should appear on top)
    for (let i = 0; i < modals.length; i++) {
      const modal = modals[i];
      if (modal.classList.contains('modal-lookup') && modal.classList.contains('show')) {
        // Check if this modal is already visible
        const isAlreadyVisible = modal.style.display === 'flex' && modal.style.opacity === '1';
        if (!isAlreadyVisible) {
          console.log('🎯 Found NEW lookup modal with show class:', modal.className);
          targetModal = modal;
          break;
        }
      }
    }
    
    // If no lookup modal, find form modal
    if (!targetModal) {
      for (let i = 0; i < modals.length; i++) {
        const modal = modals[i];
        if (isFormModal(modal)) {
          const hasShowClass = modal.classList.contains('show');
          
          if (hasShowClass) {
            // Check if already visible
            const isAlreadyVisible = modal.style.display === 'flex' && modal.style.opacity === '1';
            if (!isAlreadyVisible || !modalAlreadyShown) {
              console.log('🎯 Found FIRST modal with show class:', modal.className);
              targetModal = modal;
              break; // Stop at FIRST one, don't keep looping!
            }
          }
        }
      }
    }
    
    // If we found the target modal, show ONLY that one
    if (targetModal) {
      console.log('💪 Showing ONLY the target modal');
      modalAlreadyShown = true; // Prevent showing more modals
      
      // Hide ALL other form modals (but only same type)
      const isTargetLookup = targetModal.classList.contains('modal-lookup');
      modals.forEach(function(modal) {
        if (isFormModal(modal) && modal !== targetModal) {
          // Only hide if not a nested scenario (lookup inside form)
          const isLookup = modal.classList.contains('modal-lookup');
          if (isTargetLookup || !isLookup) {
            modal.style.display = 'none';
            modal.classList.remove('show');
            console.log('🚫 Hiding other modal:', modal.className);
          }
        }
      });
      
      // Show the target
      forceModalVisible(targetModal);
    } else {
      console.log('⏳ No modal with show class yet, waiting...');
    }
  };
  
  // Watch for NEW modals being added (basic support, not primary mechanism)
  const modalObserver = new MutationObserver(function(mutations) {
    const timeSinceClick = Date.now() - lastClickTime;
    if (timeSinceClick > 3000) return;
    
    mutations.forEach(function(mutation) {
      mutation.addedNodes.forEach(function(node) {
        if (node.nodeType === 1) {
          if (node.classList && node.classList.contains('modal') && isFormModal(node)) {
            const hasShowClass = node.classList.contains('show');
            if (hasShowClass) {
              console.log('🔍 NEW form modal added with show class');
              forceModalVisible(node);
            }
          }
        }
      });
    });
  });
  
  modalObserver.observe(document.body, {
    childList: true,
    subtree: true
  });
  
  console.log('✅ Smart modal display watcher active');
})();

// Lookup modal selection handler
(function() {
  console.log('🟢 Lookup selection handler initialized');
  
  // Handle Select button clicks in lookup modal
  document.addEventListener('click', function(e) {
    const selectButton = e.target.closest('.modal-lookup .btn.primary, .modal-lookup .btn-primary');
    
    if (selectButton && selectButton.textContent.trim() === 'Select') {
      console.log('✅ Select button clicked');
      
      const lookupModal = selectButton.closest('.modal-lookup');
      const checkedCheckbox = lookupModal.querySelector('.view-grid tbody .fa[aria-checked="true"]');
      
      if (!checkedCheckbox) {
        console.log('⚠️ No record selected');
        return;
      }
      
      const row = checkedCheckbox.closest('tr');
      const recordId = row.getAttribute('data-id');
      
      const nameCell = row.querySelector('td[data-attribute="fullname"]');
      let recordName = nameCell ? nameCell.textContent.trim() : '';
      
      if (!recordName) {
        const emailCell = row.querySelector('td[data-attribute="emailaddress1"]');
        recordName = emailCell ? emailCell.textContent.trim() : 'Selected Record';
      }
      
      console.log('📝 Selected:', recordName, recordId);
      
      const lookupModalContainer = lookupModal.closest('.lookup-modal');
      const entityLookup = lookupModalContainer ? lookupModalContainer.querySelector('.entity-lookup') : null;
      const fieldName = entityLookup ? entityLookup.getAttribute('data-lookup-datafieldname') : '';
      
      if (!fieldName || fieldName.trim() === '') {
        console.error('❌ Could not find field name');
        return;
      }
      
      console.log('🔍 Field name:', fieldName);
      
      const lookupInput = document.querySelector(`input#${CSS.escape(fieldName)}_name`);
      const lookupHiddenInput = document.querySelector(`input#${CSS.escape(fieldName)}`);
      
      if (lookupInput && recordName) {
        lookupInput.value = recordName;
        console.log('✅ Populated visible field');
        
        if (lookupHiddenInput && recordId) {
          lookupHiddenInput.value = recordId;
          lookupHiddenInput.classList.add('dirty');
          console.log('✅ Populated hidden ID');
        }
        
        lookupInput.dispatchEvent(new Event('change', { bubbles: true }));
        if (lookupHiddenInput) {
          lookupHiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
        }
        
        const closeButton = lookupModal.querySelector('[data-bs-dismiss="modal"], .close, .form-close');
        if (closeButton) {
          closeButton.click();
          console.log('✅ Modal closed');
        }
      } else {
        console.error('❌ Could not populate fields');
      }
    }
  });
  
  // Handle checkbox selection
  document.addEventListener('click', function(e) {
    const checkbox = e.target.closest('.modal-lookup .view-grid tbody .fa');
    
    if (checkbox) {
      console.log('✅ Checkbox clicked');
      
      const lookupModal = checkbox.closest('.modal-lookup');
      
      lookupModal.querySelectorAll('.view-grid tbody .fa').forEach(cb => {
        cb.setAttribute('aria-checked', 'false');
        cb.classList.remove('fa-check-square');
        cb.classList.add('fa-square-o');
      });
      
      checkbox.setAttribute('aria-checked', 'true');
      checkbox.classList.remove('fa-square-o');
      checkbox.classList.add('fa-check-square');
      
      const selectButton = lookupModal.querySelector('.btn.primary, .btn-primary');
      if (selectButton) {
        selectButton.removeAttribute('disabled');
      }
    }
  });
})();

// Remove fade class from lookup modals
(function() {
  document.addEventListener('click', function(e) {
    if (e.target.closest('.launchentitylookup')) {
      console.log('🔍 Lookup button clicked - preparing modal');
      
      setTimeout(function() {
        const lookupModal = document.querySelector('section.modal.modal-lookup');
        
        if (lookupModal) {
          lookupModal.classList.remove('fade');
          console.log('✅ Lookup modal ready');
        }
      }, 100);
    }
  }, true);
})();

console.log('🎯 All modal handlers loaded successfully');

// Clean up lookup modal text
(function() {
  console.log('🧹 Lookup modal text cleaner initialized');
  
  const cleanupLookupModal = function() {
    const lookupModal = document.querySelector('.modal-lookup');
    if (!lookupModal) return;
    
    const headers = lookupModal.querySelectorAll('.view-grid table thead th a');
    headers.forEach(function(header) {
      const text = header.textContent;
      
      let cleanText = text.split('.')[0].trim();
      cleanText = cleanText.replace(/↑|↓/g, '').trim();
      cleanText = cleanText.replace(/\s+sort\s+(ascending|descending)/gi, '').trim();
      
      if (cleanText && cleanText !== text) {
        header.textContent = cleanText;
        console.log('✅ Cleaned header:', text, '→', cleanText);
      }
    });
    
    const closeButtons = lookupModal.querySelectorAll('.modal-header .close, .modal-header .form-close');
    closeButtons.forEach(function(btn) {
      const text = btn.textContent.trim();
      if (text && text !== '×' && text.length > 1) {
        btn.textContent = '×';
        console.log('✅ Cleaned close button');
      }
    });
  };
  
  document.addEventListener('click', function(e) {
    if (e.target.closest('.launchentitylookup')) {
      setTimeout(cleanupLookupModal, 200);
      setTimeout(cleanupLookupModal, 500);
      setTimeout(cleanupLookupModal, 1000);
    }
  }, true);
  
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
        const target = mutation.target;
        if (target.classList && target.classList.contains('modal-lookup') && target.classList.contains('show')) {
          setTimeout(cleanupLookupModal, 100);
        }
      }
    });
  });
  
  observer.observe(document.body, {
    attributes: true,
    attributeFilter: ['class'],
    subtree: true
  });
  
  console.log('🧹 Text cleaner ready');
})();

// Fix close button text for ALL modals
(function() {
  console.log('🧹 Universal close button fixer initialized');
  
  const fixCloseButton = function() {
    const closeButtons = document.querySelectorAll('.modal-header .close, .modal-header .form-close, .modal-header .btn-close, .modal-header button[data-bs-dismiss]');
    
    closeButtons.forEach(function(btn) {
      const text = btn.textContent.trim();
      if (text && text.length > 1) {
        btn.textContent = '×';
        console.log('✅ Fixed close button text');
      }
    });
  };
  
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
        const target = mutation.target;
        if (target.classList && target.classList.contains('modal') && target.classList.contains('show')) {
          setTimeout(fixCloseButton, 100);
        }
      }
    });
  });
  
  observer.observe(document.body, {
    attributes: true,
    attributeFilter: ['class'],
    subtree: true
  });
  
  document.addEventListener('click', function(e) {
    if (e.target.closest('.create-action, .edit-action, .delete-action, .launchentitylookup')) {
      setTimeout(fixCloseButton, 200);
      setTimeout(fixCloseButton, 500);
    }
  }, true);
  
  console.log('🧹 Close button fixer ready');
})();

</script>
